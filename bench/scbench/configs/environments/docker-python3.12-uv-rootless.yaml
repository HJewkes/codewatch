# The SCBench pilot's environment for A0, A1a and A1. It is the BS-30 rootless config
# (the runner's docker-python3.12-uv.yaml with user 0:0) plus IS_SANDBOX. Pin this
# file's sha256 in the run manifest.
type: docker
name: python3.12
docker:
  image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
  workdir: /workspace
  mount_workspace: true
  # Rootless Docker maps container root to the host user; uid 1000 inside would be an unprivileged subuid (BS-30).
  user: "0:0"
environment:
  env:
    UV_CACHE_DIR: /tmp/uv-cache
    PIP_CACHE_DIR: /tmp/pip-cache-dir
    PIP_CONFIG_FILE: /tmp/pip-conf
    # Claude Code refuses --dangerously-skip-permissions as uid 0 unless IS_SANDBOX
    # is set. It also makes an API overload error (529) fail instead of retry; see
    # the validity notes in bench/scbench/README.md.
    IS_SANDBOX: "1"
# The runner's default ignore globs (31ceea3, execution/models.py SnapshotConfig) plus
# `.codewatch/*`, so A1's hidden repo, index and carry files never reach the graded
# snapshot. A0 and A1a write no `.codewatch/`, so their snapshots are unchanged.
snapshot:
  ignore_globs:
    - "*.pyc"
    - "__pycache__/*"
    - "venv/*"
    - ".venv/*"
    - ".evaluation_tests/*"
    - ".ruff_cache/*"
    - ".pytest_cache/*"
    - ".mypy_cache/*"
    - ".opencode/*"
    - ".claude/*"
    - "node_modules/*"
    - ".codewatch/*"
setup:
  eval_commands:
    - uv init
    - uv add -r requirements.txt
  resume_commands:
    # Create venv and install deps using standard Python (agent uses pip, not uv)
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
commands:
  entry_file: "{entry_file}.py"
  command: uv run
  agent_command: "python"
