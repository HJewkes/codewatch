# Stock claude_code.yaml plus the A1 stage fields. Keep every stock field equal to
# the config A1a runs with, so that A1 minus A1a is the stages only.
type: claude_code_cw
binary: claude
permission_mode: bypassPermissions
version: 2.0.51
cost_limits:
  cost_limit: 0
  step_limit: 100
  net_cost_limit: 0
# Caps are opt-in: stage_budget_s is unset, so stages stop launching only when less
# than stage_reserve_s remains under checkpoint_cap_s.
checkpoint_cap_s: 7200
stage_reserve_s: 180
# A stage runs when enabled. With no command it is recorded as "missing".
stages:
  # The PR flow (bench/scbench/prflow): a hidden repo at .codewatch/repo.git, one cp-N per
  # checkpoint. -P keeps the workspace's own modules off the stage's import path.
  repo-init:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m prflow repo-init --workspace /workspace
  pr-open:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m prflow pr-open --workspace /workspace
  inject: {enabled: false}
  commit-ratchet:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m prflow commit-ratchet --workspace /workspace
  # Tier T rows join the audit's findings.jsonl; tiert's counts are the report line.
  audit:
    enabled: false
    command: >-
      codewatch audit /workspace &&
      python3 /opt/codewatch-a1/tiert /workspace --out /workspace/.codewatch/audit/findings.jsonl --append
  triage: {enabled: false}
  solve-review: {enabled: false}
  # exec, so a SIGTERM reaches python and the workspace is restored.
  fix:
    enabled: false
    command: exec env PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m remediation
  synthesis:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -m synthesis
