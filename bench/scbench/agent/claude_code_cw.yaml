# Stock claude_code.yaml plus the A1 stage fields. Keep every stock field equal to
# the config A1a runs with, so that A1 minus A1a is the stages only.
type: claude_code_cw
binary: claude
permission_mode: bypassPermissions
version: 2.0.51
cost_limits:
  cost_limit: 0
  step_limit: 100
  net_cost_limit: 0
# Caps are opt-in: stage_budget_s is unset, so stages stop launching only when less
# than stage_reserve_s remains under checkpoint_cap_s.
checkpoint_cap_s: 7200
stage_reserve_s: 180
# A stage runs when enabled. With no command it is recorded as "missing".
stages:
  # The PR flow (bench/scbench/prflow): a hidden repo at .codewatch/repo.git, one cp-N per
  # checkpoint. -P keeps the workspace's own modules off the stage's import path.
  repo-init:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m prflow repo-init --workspace /workspace
  pr-open:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m prflow pr-open --workspace /workspace
  inject: {enabled: false}
  commit-ratchet:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m prflow commit-ratchet --workspace /workspace
  # codewatch audit (--changed-from the PR's merge-base commit), then Tier T, diff coverage
  # and jscpd clones, all in the audit's findings.jsonl (bench/scbench/findings/audit_stage.py).
  audit:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m findings.audit_stage --workspace /workspace
  # --model is explicit: @codewatch/cli 0.7.0 defaults to the `sonnet` alias. The agent
  # writes CW_SPEC_FILE outside /workspace for the after-solve stages. Verdicts carry
  # through the committed .codewatch/verdicts.jsonl and verdicts.d/, and this run's new
  # ones go to verdicts.d/cp-N.jsonl.
  triage:
    enabled: false
    command: >-
      codewatch triage /workspace --model claude-sonnet-5-5 --spec "$CW_SPEC_FILE"
      --verdicts-dir /workspace/.codewatch --run-id cp-$CW_CHECKPOINT
  solve-review: {enabled: false}
  # exec, so a SIGTERM reaches python and the workspace is restored. The review command
  # (bench/scbench/review) reads the spec from CW_SPEC_FILE.
  fix:
    enabled: false
    command: >-
      exec env PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m remediation
      --review-command "env PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -P -m review --mode fix"
  synthesis:
    enabled: false
    command: PYTHONPATH=/opt/codewatch-a1 /opt/codewatch-a1/py/bin/python -m synthesis
